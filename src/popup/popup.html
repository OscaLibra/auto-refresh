<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>空闲自动刷新</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="dot" id="dot"></span>
      <span class="head-title">空闲自动刷新</span>
      <span class="head-state" id="headState">检查中…</span>
    </header>

    <section class="timer">
      <div class="digits" id="digits">--:--</div>
      <div class="timer-label" id="timerLabel">后自动刷新</div>
    </section>

    <section class="meta" id="meta">
      <div class="row"><span class="k">规则</span><span class="v" id="mRule">—</span></div>
      <div class="row"><span class="k">动作</span><span class="v" id="mMode">—</span></div>
      <div class="row"><span class="k">阈值</span><span class="v" id="mIdle">—</span></div>
    </section>

    <p class="notice" id="notice" hidden></p>

    <div class="actions">
      <button type="button" class="btn" id="btnPause" disabled>暂停</button>
      <button type="button" class="btn primary" id="btnRefresh" disabled>立即刷新</button>
    </div>

    <div class="footer">
      <button type="button" class="link" id="btnOptions">设置与规则</button>
      <span class="sep">·</span>
      <button type="button" class="link" id="btnExport">导出诊断</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
